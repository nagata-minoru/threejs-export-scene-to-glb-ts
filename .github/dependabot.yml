# 依存パッケージの更新PRを週1回作る
# 公開から14日たっていない版は使わない（cooldown）。PRはセキュリティ更新も含めて、エコシステムごとに1つにまとめる
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    # TypeScript 7 は ts-loader が未対応のため、メジャー版の更新は当面受け取らない
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  # GitHub Actions のバージョン(コミット SHA で固定)も週1回更新する
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
